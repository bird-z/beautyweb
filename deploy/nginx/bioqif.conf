# http 块里需要(放 nginx.conf 或 conf.d 顶层,二选一):
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ===== 公开站:bioqif.com / www.bioqif.com -> web/dist 静态文件 =====
server {
    listen 80;
    server_name bioqif.com www.bioqif.com;
    # certbot 首次签证书用;签发后改成 301 跳 https
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bioqif.com www.bioqif.com;

    ssl_certificate     /etc/letsencrypt/live/bioqif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bioqif.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS 只加在主站,不扩散到子域(见 docs/deployment.md §3)
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/bioqif;
    index index.html;

    # 带 hash 的静态资源长缓存;index.html 不缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ===== 后台 + API:manage.bioqif.com -> payload (127.0.0.1:3000) =====
server {
    listen 80;
    server_name manage.bioqif.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name manage.bioqif.com;

    ssl_certificate     /etc/letsencrypt/live/manage.bioqif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manage.bioqif.com/privkey.pem;

    access_log /var/log/nginx/manage.bioqif.com.access.log;
    error_log  /var/log/nginx/manage.bioqif.com.error.log;

    client_max_body_size 20m;   # admin 媒体上传

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;   # Next.js HMR/WS 兜底
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
